<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">Registrácia</h4>

        @if (error) {
          <div class="alert alert-danger">{{ error }}</div>
        }
        @if (success) {
          <div class="alert alert-success">Účet vytvorený, presmerovávam na prihlásenie...</div>
        }

        <form (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label" for="name">Meno</label>
            <input id="name" class="form-control" [(ngModel)]="name" name="name" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Heslo</label>
            <input id="password" type="password" class="form-control"
                   [(ngModel)]="password" name="password" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password2">Heslo znova</label>
            <input id="password2" type="password" class="form-control"
                   [(ngModel)]="password2" name="password2" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Zaregistrovať</button>
        </form>

        <p class="mt-3 mb-0 text-center">
          Máš účet? <a routerLink="/login">Prihlásiť sa</a>
        </p>
      </div>
    </div>
  </div>
</div>
